name: daily-digest

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XIAOYU_DIARY: ${{ github.workspace }}/小鱼日记.md
        run: python daily_digest.py

      - name: Commit diary
        run: |
          git config user.name "xiaoyu-bot"
          git config user.email "xiaoyu-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "今天没有新内容"
          else
            git commit -m "diary: $(date +%F)"
            git push
          fi
